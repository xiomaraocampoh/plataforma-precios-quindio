{% extends "base.html" %}
{% block titulo %}Establecimientos · AhorraPues{% endblock %}
{% block contenido %}
<div class="encabezado con-fondo con-fondo-der">
  <div>
    <p class="etiqueta">Directorio</p>
    <h1>Establecimientos</h1>
  </div>
  {% if user.is_authenticated %}<a class="btn btn-sec" href="{% url 'establecimientos:sugerir' %}"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>Sugerir un establecimiento</a>{% endif %}
</div>
<form class="filtros" method="get" action="{% url 'establecimientos:directorio' %}" aria-label="Filtrar establecimientos"
      hx-get="{% url 'establecimientos:directorio' %}" hx-target="#lista-establecimientos" hx-push-url="true" hx-trigger="change, submit">
  <div class="campo">
    <label for="f-municipio">Municipio</label>
    <select id="f-municipio" name="municipio">
      <option value="">Todos</option>
      {% for m in municipios %}<option value="{{ m }}"{% if m == filtros.municipio %} selected{% endif %}>{{ m }}</option>{% endfor %}
    </select>
  </div>
  <div class="campo">
    <label for="f-barrio">Barrio</label>
    <select id="f-barrio" name="barrio">
      <option value="">Todos</option>
      {% for b in barrios %}<option value="{{ b }}"{% if b == filtros.barrio %} selected{% endif %}>{{ b }}</option>{% endfor %}
    </select>
  </div>
  <div class="campo">
    <label for="f-tipo">Tipo</label>
    <select id="f-tipo" name="tipo">
      <option value="">Todos</option>
      {% for valor, nombre in tipos %}<option value="{{ valor }}"{% if valor == filtros.tipo %} selected{% endif %}>{{ nombre }}</option>{% endfor %}
    </select>
  </div>
  <div class="acciones-filtro">
    <button class="btn" type="submit">Filtrar</button>
    <a class="btn btn-sec" href="{% url 'establecimientos:directorio' %}">Limpiar</a>
  </div>
</form>
<div id="lista-establecimientos" aria-live="polite">{% include "establecimientos/partials/_lista.html" %}</div>
{% endblock %}
