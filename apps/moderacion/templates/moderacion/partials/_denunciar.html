{% if listo %}
<p class="chip" role="status"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg>{{ mensaje }}</p>
{% else %}
<form method="post" action="{% url 'moderacion:denunciar' reporte_id %}" class="form-denuncia"
      hx-post="{% url 'moderacion:denunciar' reporte_id %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button">
  {% csrf_token %}
  {% if mensaje %}<span class="error" role="alert">{{ mensaje }}</span>{% endif %}
  {% include "partials/_campo.html" with campo=form.motivo %}
  {% include "partials/_campo.html" with campo=form.detalle %}
  <button class="btn btn-sec btn-pequeno" type="submit">Enviar denuncia</button>
</form>
{% endif %}
