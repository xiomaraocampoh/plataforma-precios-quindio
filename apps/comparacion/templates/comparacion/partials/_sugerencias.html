{% for p in productos %}
  <li><a class="sug-foto" href="{% url 'comparacion:comparar' p.pk %}">{% include "partials/_foto_producto.html" with producto=p clase="foto-chip" %}<span class="sug-nombre">{{ p }}</span></a></li>
{% empty %}
  {% if muy_corto %}
  <li class="vacio">Escribe al menos dos letras.</li>
  {% else %}
  <li class="vacio">No encontramos «{{ texto }}». Prueba con otro nombre.</li>
  {% endif %}
{% endfor %}
