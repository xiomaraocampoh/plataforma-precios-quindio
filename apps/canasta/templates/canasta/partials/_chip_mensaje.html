<form class="{{ clase|default:"chip-form" }}" method="post" action="{% url 'canasta:enviar' %}" hx-post="{% url 'canasta:enviar' %}" hx-target="#chat-hilo" hx-swap="innerHTML">
  {% csrf_token %}<input type="hidden" name="mensaje" value="{{ texto }}">{% if tema %}<input type="hidden" name="tema" value="{{ tema }}">{% endif %}
  <button class="{{ boton|default:"chip-resp" }}" type="submit">{% if icono %}<svg class="ico" aria-hidden="true"><use href="#{{ icono }}"/></svg>{% endif %}<span>{{ etiqueta|default:texto }}</span></button>
</form>
