{% extends "base.html" %}
{% block titulo %}Confirmar tu correo · AhorraPues{% endblock %}
{% block contenido %}
<div class="auth bento">
  <section class="tile tile-3" aria-labelledby="t-verificar">
    <p><span class="chip chip-promo">Falta confirmar</span></p>
    <h1 id="t-verificar">Confirma tu correo</h1>
    <p class="suave">Un clic y listo. Después recibirás los avisos de seguridad y de tus aportes.</p>
    <form method="post">{% csrf_token %}<button class="btn btn-bloque" type="submit">Confirmar mi correo</button></form>
  </section>
</div>
{% endblock %}
