# Despliegue de producción reproducible (ADR-017). Guía completa: docs/operacion/despliegue.md
#
#   cp .env.prod.example .env.prod          # y reemplazar los valores «cambia-…»
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# `name` aísla este despliegue del docker-compose.yml de desarrollo (otros contenedores, red y
# volúmenes): levantar uno no toca al otro.
name: ahorrapues-prod

x-aplicacion: &aplicacion
  image: ahorrapues:prod
  env_file: .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://precios:${POSTGRES_PASSWORD}@db:5432/precios
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: precios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: precios
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precios"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Paso único: aplica las migraciones y termina. `web` espera a que acabe bien.
  migrar:
    <<: *aplicacion
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *aplicacion
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: unless-stopped
    ports: ["${WEB_PORT:-8000}:8000"]
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # /healthz/ responde 503 si PostgreSQL o la caché fallan. La cabecera simula el proxy TLS;
    # «localhost» debe estar en ALLOWED_HOSTS.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}), timeout=4)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
