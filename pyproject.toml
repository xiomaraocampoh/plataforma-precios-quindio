[project]
name = "plataforma-precios-quindio"
version = "0.1.0"
description = "Plataforma colaborativa de comparación de precios entre tiendas y supermercados (Armenia / Quindío)"
requires-python = ">=3.12"
# Lo que instala Vercel (ADR-0031). Igual a requirements.txt; la fuente es requirements/prod.txt.
# tests/unit/test_requisitos_vercel.py falla si se desalinean. Docker y Render no leen esta lista.
dependencies = [
  "Django==5.2.18",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "django-environ==0.14.0",
  "django-htmx==1.29.0",
  "psycopg[binary]==3.3.7",
  "redis==8.1.0",
  "anthropic==2.9.0",
  "pyotp==2.12.0",
  "qrcode==8.2",
  "defusedxml==0.7.1",
  "django-anymail[brevo]==15.2",
  "gunicorn==23.0.0",
  "whitenoise==6.11.0",
]

# ── Ruff: linter + formateador (PEP 8) ────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle (PEP 8)
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "B",        # bugbear
  "UP",       # pyupgrade
  "DJ",       # flake8-django
  "S",        # bandit (seguridad)
  "C90",      # complejidad ciclomática
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/*.py" = ["F403", "F405", "S105"]

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "unit: reglas de dominio puras, sin base de datos",
  "integration: requiere base de datos / API",
  "e2e: navegador real con Playwright (python -m playwright install chromium)",
]

# ── Cobertura (M-19) ──────────────────────────────────
[tool.coverage.run]
source = ["apps", "core"]
branch = true
relative_files = true  # rutas relativas en coverage.xml: SonarQube en Docker y CI las resuelven
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
