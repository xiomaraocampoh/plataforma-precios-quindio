# SonarQube — análisis estático del monolito modular (M-19, M-20; ver docs/calidad/sonarqube.md)
sonar.projectKey=plataforma-precios-quindio
sonar.projectName=Plataforma de precios Quindío (AhorraPues)
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=apps,config,core
sonar.tests=tests
sonar.python.version=3.12

# Migraciones generadas, librerías de terceros y plantillas fuera del análisis
sonar.exclusions=**/migrations/**,**/__pycache__/**,static/vendor/**
# Igual que [tool.coverage.run].omit en pyproject.toml, más la configuración
sonar.coverage.exclusions=**/migrations/**,**/admin.py,**/apps.py,config/**,manage.py
sonar.cpd.exclusions=**/migrations/**

# Cobertura generada antes con: pytest --cov --cov-report=xml (rutas relativas: relative_files)
sonar.python.coverage.reportPaths=coverage.xml
