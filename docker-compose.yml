# Entorno local reproducible: docker compose up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: precios
      POSTGRES_PASSWORD: precios
      POSTGRES_DB: precios
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precios"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: dev  # la imagen de producción (docker-compose.prod.yml) no lleva pytest ni ruff
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://precios:precios@db:5432/precios
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
